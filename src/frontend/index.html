<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Autonomous Analyst Agent</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- Landing Page View -->
  <div id="landing-view" class="view-active">
    <div class="landing-content">
      <h1>Autonomous Analyst Agent</h1>
      <p>Deploy your intelligent partner for advanced data analysis and predictive modeling.</p>
      <div class="action-buttons">
        <button id="btn-open-login" class="btn primary">Login</button>
        <button id="btn-open-register" class="btn secondary">Register</button>
      </div>
    </div>
  </div>

  <!-- Login Modal -->
  <div id="login-modal" class="modal">
    <div class="modal-content">
      <span class="close-btn" id="close-login">&times;</span>
      <h2>System Login</h2>
      <form id="login-form">
        <div class="input-group">
          <label for="login-username">Username</label>
          <!-- name="username" -->
          <input type="text" id="login-username" name="username" required placeholder="Enter username">
        </div>
        <div class="input-group">
          <label for="login-password">Password</label>
          <!-- name="password" -->
          <input type="password" id="login-password" name="password" required placeholder="Enter password">
        </div>
        <button type="submit" class="btn primary full-width">Authenticate</button>
      </form>
    </div>
  </div>

  <!-- Register Modal -->
  <div id="register-modal" class="modal">
    <div class="modal-content">
      <span class="close-btn" id="close-register">&times;</span>
      <h2>Create Agent Access</h2>
      <form id="register-form">
        <div class="input-group">
          <label for="reg-username">Username</label>
          <!-- name="username" -->
          <input type="text" id="reg-username" name="username" required placeholder="Choose a username">
        </div>
        <div class="input-group">
          <label for="reg-email">Email</label>
          <!-- name="email" -->
          <input type="email" id="reg-email" name="email" required placeholder="Enter your email">
        </div>
        <div class="input-group">
          <label for="reg-password">Password</label>
          <!-- name="password" -->
          <input type="password" id="reg-password" name="password" required placeholder="Create a password">
        </div>
        <button type="submit" class="btn primary full-width">Initialize Protocol</button>
      </form>
    </div>
  </div>

  <!-- AI Chat Interface View -->
  <div id="chat-view" class="view-hidden">
    <header class="chat-header">
      <h2>System Terminal: Analyst Agent</h2>
      <button id="btn-logout" class="btn outline small">Logout</button>
    </header>

    <div class="chat-container" id="chat-container">
      <!-- Initial AI Greeting -->
      <div class="message ai-message">
        <div class="avatar">AI</div>
        <div class="text">Authentication successful. Systems online. How can I assist with your analysis today?</div>
      </div>
    </div>

    <div class="chat-input-wrapper">
      <form id="chat-form">
        <input type="text" id="chat-input" placeholder="Enter query or command..." required autocomplete="off">
        <button type="submit" class="btn primary">Send</button>
      </form>
    </div>
  </div>

  <script src="script.js"></script>
</body>

</html>
